# External-model backends, deployed IN-CLUSTER as peers of PlanDev's own services.
#
# These adapters join PlanDev's compose network and are reached by SERVICE NAME
# (http://blackbird-adapter:5011), exactly like merlin reaches sequencing-server. They are
# deliberately NOT published to the host: an adapter is an operator-run component inside the
# trust boundary, not a third-party endpoint PlanDev calls out to. Plan data therefore never
# leaves the cluster, and an adapter's exposure matches every other PlanDev service.
#
#   # 1. Point at your PlanDev deployment's network (see `docker network ls`):
#   export PLANDEV_NETWORK=plandev-dupe-1_default
#   # 2. Blackbird only: drop a JNISpice jar in ./blackbird/vendor (see blackbird/vendor/README.md)
#   docker compose up --build
#   docker compose up --build python     # just the pure-Python one (no JNISpice jar needed)
#   docker compose up --build basilisk   # real astrodynamics; no jar either, but a 1.3 GB image
#
# The basilisk image bakes in ~128 MB of SPICE kernels at BUILD time, so building it needs egress to
# naif.jpl.nasa.gov once. After that it runs with no network of its own.
#
# Then set merlin's AND EVERY merlin worker's EXTERNAL_MODEL_BACKENDS to the service names —
# see ./README.md ("Wire PlanDev to the backends"). Both must match, or a model will introspect
# fine and then fail to simulate.

services:
  blackbird:
    build:
      context: .
      dockerfile: blackbird/Dockerfile
      # Defaults to the v2022-05 jar that matches jplTime 2025-10a. If you have a different
      # SPICE toolkit version, export JNISPICE_JAR / JNISPICE_VERSION before `docker compose up`:
      #   export JNISPICE_JAR=JNISpice-N0067.jar JNISPICE_VERSION=N0067
      args:
        JNISPICE_JAR: ${JNISPICE_JAR:-JNISpice-v2022-05.jar}
        JNISPICE_VERSION: ${JNISPICE_VERSION:-v2022-05}
    image: plandev/blackbird-adapter
    container_name: blackbird-adapter
    networks: [plandev]
    restart: unless-stopped
    # In-cluster only — no host exposure. Uncomment ONLY for local debugging:
    # ports: ["5011:5011"]

  python:
    build:
      context: .
      dockerfile: python/Dockerfile
    image: plandev/python-adapter
    container_name: python-adapter
    networks: [plandev]
    restart: unless-stopped
    # ports: ["5002:5002"]

  basilisk:
    build:
      context: .
      dockerfile: basilisk/Dockerfile
    image: plandev/basilisk-adapter
    container_name: basilisk-adapter
    networks: [plandev]
    restart: unless-stopped
    # ports: ["5021:5021"]

networks:
  plandev:
    external: true
    name: ${PLANDEV_NETWORK:-plandev_default}
