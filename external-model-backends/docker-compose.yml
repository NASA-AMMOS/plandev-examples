# External-model backends PlanDev connects to over HTTP.
#
# PlanDev's merlin-server reaches these on the host via `host.docker.internal` at the ports below.
# After `docker compose up`, wire them into PlanDev by setting merlin's EXTERNAL_MODEL_BACKENDS env
# var — see ./README.md ("Wire PlanDev to the backends").
#
#   docker compose up --build         # build + run both
#   docker compose up --build python  # just the pure-Python one (no JNISpice jar needed)
#
# The blackbird service needs a JNISpice jar in ./blackbird/vendor first — see
# ./blackbird/vendor/README.md.

services:
  blackbird:
    build:
      context: ./blackbird
    image: plandev/blackbird-adapter
    ports: ["5011:5011"]
    restart: unless-stopped

  python:
    build:
      context: ./python
    image: plandev/python-adapter
    ports: ["5002:5002"]
    restart: unless-stopped
