name: External model backends

# Unit tests for the Python adapter scripts under external-model-backends/.
#
# These are stdlib-only and hermetic: no Docker, no JVM, no network, no live adapter. They are in
# their own workflow rather than in build.yml because build.yml is the Gradle/Java build and these
# share nothing with it -- no Java, no Gradle cache, and no reason for one to block the other.
#
# NOT run here: external-model-backends/blackbird/check_coverage.py. That is a conformance harness,
# not a unit test -- it drives a LIVE adapter over HTTP (`python3 check_coverage.py <base_url>`)
# and asserts that every Blackbird resource type maps to the right PlanDev ValueSchema and actually
# emits segments. Running it needs the blackbird image built (Maven + JDK 21 + a JNISpice jar that
# is not redistributable, see blackbird/vendor/README.md) and the adapter listening on :5011. It
# would fit a separate, opt-in integration job that does `docker compose up --build blackbird`,
# waits for /models, then runs the harness -- deliberately left out until the vendored jar has a
# CI-accessible source.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The two interpreters these scripts actually ship on: python/Dockerfile is python:3.12-slim,
        # and blackbird/Dockerfile's runtime is eclipse-temurin:21-jre-jammy + the distro python3 (3.10).
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # adapter_core owns the half of the wire contract that is not model-specific -- HTTP, routing,
      # the ValueSchema typechecker, defaults, the identity hash, response validation -- and is shared
      # by every adapter. It is tested first because a break here breaks all of them.
      - name: adapter_core tests
        working-directory: external-model-backends
        run: python3 test_adapter_core.py -v

      - name: py_model_server tests
        working-directory: external-model-backends/python
        run: python3 test_py_model_server.py -v

      - name: bb_service tests
        working-directory: external-model-backends/blackbird
        run: python3 test_bb_service.py -v

      # The 2 tests that need a live Blackbird adapter skip cleanly when nothing answers on
      # BB_ADAPTER_URL; the other 41 run against the checked-in fixture.
      - name: bb_import tests
        working-directory: external-model-backends/blackbird
        run: python3 test_bb_import.py -v

      # Covers basilisk/ too: compileall byte-compiles without importing, so it needs no Basilisk.
      - name: Syntax-check the scripts that have no tests yet
        run: python3 -m compileall -q external-model-backends

  # Separate job because these are the only tests with a heavy third-party dependency. `pip install
  # bsk` is ~16 s, so it is cheap enough to run on every PR, but there is no reason for it to slow
  # down or block the hermetic suite above. 3.12 only: basilisk/Dockerfile is python:3.12-slim, and
  # running the same tests on 3.10 would install a 500 MB wheel to learn nothing.
  #
  # NOT installed here: the SPICE kernels. They are 128 MB from naif.jpl.nasa.gov, which on every CI
  # run would be both flaky and rude; the tests that need a real propagation skip themselves when the
  # kernels are absent. The container bakes them in, so those tests do run in the image and in the
  # PlanDev e2e suite (ExternalModelTests).
  basilisk-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The PyPI name is `bsk`. `pip install Basilisk` fetches an unrelated Redis ORM.
      - name: Install Basilisk
        run: pip install "bsk==2.11.0" "numpy>=1.26"

      - name: bsk_service tests
        working-directory: external-model-backends/basilisk
        run: python3 test_bsk_service.py -v

  # The Rust model. Separate from the hermetic job because it needs a Rust toolchain, and separate
  # from the Basilisk job because they share nothing. `nx_service.py` is a shim over ExecBackend, so
  # what is really under test here is that a model in ANOTHER LANGUAGE gets the whole contract --
  # which is the claim the other three adapters cannot make.
  nexosim-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Rust model tests
        working-directory: external-model-backends/nexosim
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # The Python tests drive the RELEASE binary over the stdio protocol, so it has to exist first.
      - name: Build the model binary
        working-directory: external-model-backends/nexosim
        run: cargo build --release

      - name: nx_service tests
        working-directory: external-model-backends/nexosim
        run: python3 test_nx_service.py -v
