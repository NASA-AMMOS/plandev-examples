name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true

      - name: Set up Java 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0

      - name: Build & test all subprojects
        run: ./gradlew build
        env:
          GITHUB_USER: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  actions:
    name: Actions (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/actions

    steps:
      - name: Check out repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: examples/actions/.nvmrc
          cache: npm
          cache-dependency-path: examples/actions/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --workspaces

      - name: Build
        run: npm run build --workspaces

      - name: Test
        run: npm test --workspaces

  ui-plugins:
    name: UI plugins (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/ui-plugins/time/lmst

    steps:
      - name: Check out repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: examples/actions/.nvmrc
          cache: npm
          cache-dependency-path: examples/ui-plugins/time/lmst/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: ./node_modules/.bin/tsc --noEmit -p ../../tsconfig.json

      - name: Build
        run: npm run build
