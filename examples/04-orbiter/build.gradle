dependencies {
  implementation project(':libraries:power')
  implementation project(':libraries:data')
  implementation project(':libraries:geometry')
  implementation project(':libraries:gnc')
  implementation project(':libraries:telecom')

  // jplTime library used by geometry code
  implementation name: 'jplTime-2022-08'

  // JNISpice for SPICE geometry calculations
  implementation name: 'JNISpice-N0067'

  // External deps used by orbiter
  implementation 'com.google.code.gson:gson:2.8.7'
  implementation 'org.apache.commons:commons-lang3:3.12.0'
  implementation 'org.apache.commons:commons-math3:+'
}

// Fat JAR for uploading to Aerie
jar {
  dependsOn configurations.runtimeClasspath
  from {
    configurations.runtimeClasspath.filter { it.exists() }.collect { it.isDirectory() ? it : zipTree(it) }
  }
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  archiveFileName.set("orbiter-example.jar")
}
